<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#191b18}canvas{display:block;touch-action:none}#status{position:absolute;top:12px;left:12px;right:12px;color:#d5b47c;font:13px sans-serif;pointer-events:none}</style>
<div id="status">正在准备三维渲染器…</div>
<script>window.gsReady=false;window.gsError='';window.addEventListener('error',e=>{window.gsError=e.message;document.querySelector('#status').textContent=e.message});window.addEventListener('unhandledrejection',e=>{window.gsError=String(e.reason);document.querySelector('#status').textContent=String(e.reason)});</script>
<script src="viewer.js"></script></html>
